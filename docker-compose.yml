services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wildlife
      POSTGRES_USER: wildlife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildlife-change-me}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U wildlife"], interval: 10s, timeout: 5s, retries: 10 }

  redis:
    image: redis:7.4-alpine
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wildlife}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wildlife-secret-change-me}
    volumes: [minio-data:/data]

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &backend-env
      WILDLIFE_DATABASE_URL: postgresql+psycopg://wildlife:${POSTGRES_PASSWORD:-wildlife-change-me}@postgres:5432/wildlife
      WILDLIFE_REDIS_URL: redis://redis:6379/0
      WILDLIFE_TASK_BACKEND: celery
      WILDLIFE_OBJECT_STORAGE_ENABLED: "true"
      WILDLIFE_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      WILDLIFE_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-wildlife}
      WILDLIFE_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-wildlife-secret-change-me}
      WILDLIFE_JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      WILDLIFE_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      WILDLIFE_STORAGE_DIR: /data/storage
      WILDLIFE_MODELS_DIR: /data/models
      WILDLIFE_REFERENCE_RETRIEVAL_BACKEND: histogram
    volumes:
      - ./storage:/data/storage
      - ./models:/data/models:ro
      - ./reference_species:/reference_species:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    environment: *backend-env
    volumes:
      - ./storage:/data/storage
      - ./models:/data/models:ro
      - ./reference_species:/reference_species:ro
    depends_on: [api, redis]

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
  minio-data:
